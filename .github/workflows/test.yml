name: Test CodeQL ARM64 Action

on:
  push:
    branches: [v1, initial-release]
  pull_request:
    branches: [v1]
  workflow_dispatch:

jobs:
  test-arm64-interpreted:
    name: ARM64 — Interpreted language (Python)
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4

      - uses: caseware/codeql-arm64-compat@v1
        id: codeql-setup

      - name: Create test project
        run: |
          mkdir -p /tmp/test-project
          cat > /tmp/test-project/app.py << 'EOF'
          import os
          import subprocess

          def run_command(user_input):
              # Intentional vulnerability for CodeQL to find
              subprocess.call(user_input, shell=True)

          def read_file(filename):
              with open(filename) as f:
                  return f.read()
          EOF

      - name: Create database
        run: |
          codeql database create /tmp/test-db \
            --language=python \
            --source-root=/tmp/test-project

      - name: Run analysis
        run: |
          codeql pack download codeql/python-queries
          codeql database analyze /tmp/test-db codeql/python-queries \
            --format=sarif-latest \
            --output=/tmp/results.sarif

      - name: Verify results
        run: |
          echo "SARIF file size: $(wc -c < /tmp/results.sarif) bytes"
          python3 -c "
          import json
          with open('/tmp/results.sarif') as f:
              sarif = json.load(f)
          runs = sarif['runs']
          print(f'Analysis runs: {len(runs)}')
          for run in runs:
              results = run.get('results', [])
              print(f'Results found: {len(results)}')
          "

  test-arm64-compiled:
    name: ARM64 — Compiled language support (rootfs extraction)
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4

      - uses: caseware/codeql-arm64-compat@v1
        id: codeql-setup
        with:
          enable-compiled-languages: 'true'

      - name: Verify QEMU_LD_PREFIX is set
        run: |
          echo "QEMU_LD_PREFIX=$QEMU_LD_PREFIX"
          test -n "$QEMU_LD_PREFIX"
          echo "Rootfs contents:"
          ls -la "$QEMU_LD_PREFIX/" | head -20
          ls -la "$QEMU_LD_PREFIX/lib64/" 2>/dev/null || ls -la "$QEMU_LD_PREFIX/lib/" 2>/dev/null || true
          # The dynamic linker could be at lib64/ or lib/x86_64-linux-gnu/
          LD_PATH=$(find "$QEMU_LD_PREFIX" -name "ld-linux-x86-64.so*" -type f -o -name "ld-linux-x86-64.so*" -type l 2>/dev/null | head -1)
          test -n "$LD_PATH"
          echo "Dynamic linker found at: $LD_PATH"

      - name: Verify x86_64 binary execution via QEMU
        run: |
          CODEQL_DIR=$(which codeql | xargs dirname)
          echo "CodeQL dir: $CODEQL_DIR"
          file "$CODEQL_DIR/tools/linux64/runner" || true
          # runner is x86_64 dynamically-linked — should work with QEMU_LD_PREFIX
          "$CODEQL_DIR/tools/linux64/runner" --help 2>&1 | head -5 || echo "runner invocation attempted"

  test-arm64-javascript:
    name: ARM64 — JavaScript analysis
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4

      - uses: caseware/codeql-arm64-compat@v1

      - name: Create test project
        run: |
          mkdir -p /tmp/js-project
          cat > /tmp/js-project/index.js << 'EOF'
          const http = require('http');
          const { exec } = require('child_process');

          const server = http.createServer((req, res) => {
            // Intentional command injection for CodeQL to detect
            exec(req.url, (err, stdout) => {
              res.end(stdout);
            });
          });

          server.listen(3000);
          EOF

      - name: Create database
        run: |
          codeql database create /tmp/js-db \
            --language=javascript \
            --source-root=/tmp/js-project

      - name: Run analysis
        run: |
          codeql pack download codeql/javascript-queries
          codeql database analyze /tmp/js-db codeql/javascript-queries \
            --format=sarif-latest \
            --output=/tmp/js-results.sarif

      - name: Verify results
        run: |
          echo "SARIF file size: $(wc -c < /tmp/js-results.sarif) bytes"
          python3 -c "
          import json
          with open('/tmp/js-results.sarif') as f:
              sarif = json.load(f)
          for run in sarif['runs']:
              print(f'Results: {len(run.get(\"results\", []))}')
          "

  test-x86_64-passthrough:
    name: x86_64 — Pass-through (no-op)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: caseware/codeql-arm64-compat@v1
        id: codeql-setup

      - name: Verify no patching occurred
        run: |
          echo "Architecture: $(uname -m)"
          if [ "$(uname -m)" = "x86_64" ]; then
            echo "Correctly detected as non-ARM64 — action was a no-op"
          fi

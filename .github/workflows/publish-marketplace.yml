name: Publish this Action to the GitHub Marketplace

on:
  push:
    branches: [v1]
    paths:
      - VERSION
  workflow_dispatch:

permissions: {}

# Serialize releases; never cancel an in-progress publish (could leave a half-tagged state).
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-stub-tracer:
    name: Build ARM64 stub tracer
    runs-on: ubuntu-24.04-arm
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@v6

      - name: Install musl toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y musl-tools

      - name: Build static ARM64 binary
        run: |
          musl-gcc -static -O2 -s -o preload_tracer-arm64 src/stub-tracer.c
          file preload_tracer-arm64
          sha256sum preload_tracer-arm64

      - name: Attest build provenance
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: preload_tracer-arm64

      - name: Upload stub tracer artifact
        uses: actions/upload-artifact@v4
        with:
          name: preload_tracer-arm64
          path: preload_tracer-arm64

  publish:
    needs: build-stub-tracer
    runs-on: ubuntu-24.04-arm
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Download stub tracer artifact
        uses: actions/download-artifact@v4.1.3
        with:
          name: preload_tracer-arm64

      - name: Validate VERSION and derive tag
        id: version
        shell: bash
        run: |
          if [ ! -f VERSION ]; then
            echo "::error::VERSION file is missing"
            exit 1
          fi

          VERSION=$(tr -d '[:space:]' < VERSION)
          if ! echo "$VERSION" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "::error::VERSION must be strict semver (e.g. 1.2.3)"
            exit 1
          fi

          TAG="v$VERSION"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

      - name: Ensure tag is immutable (rerun-safe)
        id: tag-check
        shell: bash
        env:
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          EXISTING_SHA=$(git ls-remote --tags origin "refs/tags/$TAG" | awk '{print $1}' || true)
          if [ -z "$EXISTING_SHA" ]; then
            echo "tag_exists=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if [ "$EXISTING_SHA" = "$GITHUB_SHA" ]; then
            echo "tag_exists=true" >> "$GITHUB_OUTPUT"
            echo "Tag $TAG already points to current SHA ($GITHUB_SHA); continuing."
            exit 0
          fi

          echo "::error::Tag $TAG already exists on origin and points to $EXISTING_SHA (current SHA: $GITHUB_SHA)."
          exit 1

      - name: Create and push tag
        if: steps.tag-check.outputs.tag_exists != 'true'
        shell: bash
        env:
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          git tag "$TAG" "$GITHUB_SHA"
          git push origin "refs/tags/$TAG"

      - name: Detect previous release tag
        id: previous
        shell: bash
        env:
          TAG: ${{ steps.version.outputs.tag }}
          GH_TOKEN: ${{ github.token }}
        run: |
          CURRENT="${TAG#v}"

          # Find the latest GitHub Release tag strictly lower than CURRENT.
          # Uses gh release list so we compare against actual releases, not just
          # tags that may have been created without a release.
          PREVIOUS_TAG=$(gh release list --json tagName -q '.[].tagName' \
            | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' \
            | sed 's/^v//' \
            | awk -v cur="$CURRENT" '
              function vercmp(a,b,  i,A,B,n1,n2) {
                split(a, A, "."); split(b, B, ".");
                for (i = 1; i <= 3; i++) {
                  n1 = A[i] + 0; n2 = B[i] + 0;
                  if (n1 < n2) return -1;
                  if (n1 > n2) return 1;
                }
                return 0;
              }
              { if (vercmp($0, cur) < 0) print $0 }
            ' \
            | sort -V \
            | tail -1 || true)

          if [ -n "$PREVIOUS_TAG" ]; then
            PREVIOUS_TAG="v$PREVIOUS_TAG"
          fi

          # Fallback: if no release found, use the most recent reachable tag.
          if [ -z "$PREVIOUS_TAG" ]; then
            PREVIOUS_TAG=$(git describe --tags --abbrev=0 "$TAG^" 2>/dev/null || true)
          fi

          echo "previous_tag=$PREVIOUS_TAG" >> "$GITHUB_OUTPUT"
          echo "Previous release tag: ${PREVIOUS_TAG:-<none>}"

      - name: Generate changelog and verify commit signatures
        id: changelog
        shell: bash
        env:
          TAG: ${{ steps.version.outputs.tag }}
          PREVIOUS_TAG: ${{ steps.previous.outputs.previous_tag }}
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ -z "$PREVIOUS_TAG" ]; then
            RANGE="$TAG"
          else
            RANGE="${PREVIOUS_TAG}..${TAG}"
          fi

          echo "::group::Generating changelog for $RANGE"

          # ── Changelog ──
          {
            echo "## What's Changed"
            echo ""
            git log --first-parent --pretty='format:* %s (%h)' "$RANGE" | head -100
            echo ""
          } > CHANGELOG.md

          # ── Commit signature chain ──
          # Verify signatures via the GitHub API (supports GPG, SSH, S/MIME
          # without needing local keys or allowedSignersFile).
          echo ""
          echo "## Commit Signature Verification"
          echo "" >> CHANGELOG.md
          echo "### Commit signature chain" >> CHANGELOG.md
          echo "" >> CHANGELOG.md

          UNSIGNED=0
          TOTAL=0
          UNSIGNED_LIST=""
          REPO="${GITHUB_REPOSITORY}"

          while IFS= read -r line; do
            SHA=$(echo "$line" | cut -d' ' -f1)
            SUBJECT=$(echo "$line" | cut -d' ' -f2-)
            TOTAL=$((TOTAL + 1))

            # Query GitHub API for signature verification status
            API_RESPONSE=$(gh api "repos/${REPO}/commits/${SHA}" \
              --jq '.commit.verification | "\(.verified) \(.reason)"' 2>&1) || true

            VERIFIED=$(echo "$API_RESPONSE" | cut -d' ' -f1)
            REASON=$(echo "$API_RESPONSE" | cut -d' ' -f2-)

            if [ "$VERIFIED" = "true" ]; then
              echo "  [VERIFIED] $SHA $SUBJECT"
              echo "* \`$SHA\` — **verified** ($REASON) — $SUBJECT" >> CHANGELOG.md
            else
              echo "  [UNVERIFIED] $SHA (reason: $REASON) $SUBJECT"
              echo "* \`$SHA\` — **UNVERIFIED** ($REASON) — $SUBJECT" >> CHANGELOG.md
              UNSIGNED=$((UNSIGNED + 1))
              UNSIGNED_LIST="${UNSIGNED_LIST}  - ${SHA} (${REASON}) ${SUBJECT}\n"
            fi
          done < <(git log --first-parent --pretty='format:%H %s' "$RANGE")

          # Cryptographic chain summary
          HEAD_SHA=$(git rev-parse HEAD)
          echo "" >> CHANGELOG.md
          echo "**Release HEAD:** \`$HEAD_SHA\`" >> CHANGELOG.md
          echo "" >> CHANGELOG.md

          if [ "$UNSIGNED" -gt 0 ]; then
            echo "::warning::$UNSIGNED of $TOTAL commits in $RANGE have unverified signatures."
            printf "Unverified commits:\n%b" "$UNSIGNED_LIST"
            echo "> ⚠ $UNSIGNED of $TOTAL commit(s) have unverified signatures." >> CHANGELOG.md
          else
            echo "All $TOTAL commits have verified signatures."
            echo "> All $TOTAL commit(s) in this release have GitHub-verified signatures." >> CHANGELOG.md
          fi
          echo "" >> CHANGELOG.md

          echo "::endgroup::"

          # Store changelog for release body
          {
            echo 'changes<<CHANGELOG_EOF'
            cat CHANGELOG.md
            echo 'CHANGELOG_EOF'
          } >> "$GITHUB_OUTPUT"

      - name: Attest changelog provenance
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: CHANGELOG.md

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
          CHANGELOG: ${{ steps.changelog.outputs.changes }}
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG already exists; ensuring assets are present"
            gh release upload "$TAG" preload_tracer-arm64 CHANGELOG.md --clobber
            exit 0
          fi

          gh release create "$TAG" \
            preload_tracer-arm64 \
            CHANGELOG.md \
            --title "$TAG" \
            --notes "$CHANGELOG"

      - name: Attest action source provenance
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: |
            action.yml
            src/stub-tracer.c
            patch-codeql.sh

name: Publish this Action to the GitHub Marketplace

on:
  push:
    branches: [master]
    paths:
      - VERSION
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Validate VERSION and derive tag
        id: version
        shell: bash
        run: |
          if [ ! -f VERSION ]; then
            echo "::error::VERSION file is missing"
            exit 1
          fi

          VERSION=$(tr -d '[:space:]' < VERSION)
          if ! echo "$VERSION" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "::error::VERSION must be strict semver (e.g. 1.2.3)"
            exit 1
          fi

          TAG="v$VERSION"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

      - name: Ensure tag is immutable
        shell: bash
        env:
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          if git ls-remote --exit-code --tags origin "refs/tags/$TAG" >/dev/null 2>&1; then
            echo "::error::Tag $TAG already exists on origin and will not be overwritten."
            exit 1
          fi

      - name: Create and push tag
        shell: bash
        env:
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          git tag "$TAG" "$GITHUB_SHA"
          git push origin "refs/tags/$TAG"

      - name: Detect previous version tag
        id: previous
        shell: bash
        env:
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          PREVIOUS_TAG=$(git --no-pager tag --sort=-v:refname | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | grep -vx "$TAG" | head -1 || true)
          echo "previous_tag=$PREVIOUS_TAG" >> "$GITHUB_OUTPUT"

      - name: Generate changelog from conventional commits
        if: steps.previous.outputs.previous_tag != ''
        id: changelog
        uses: requarks/changelog-action@v1
        with:
          token: ${{ github.token }}
          fromTag: ${{ steps.version.outputs.tag }}
          toTag: ${{ steps.previous.outputs.previous_tag }}
          writeToFile: false

      - name: Fallback changelog for first release
        if: steps.previous.outputs.previous_tag == ''
        id: fallback
        shell: bash
        env:
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          {
            echo 'notes<<EOF'
            echo "Initial release $TAG"
            echo
            echo "Recent commits:"
            git --no-pager log --pretty='- %s (%h)' -20
            echo 'EOF'
          } >> "$GITHUB_OUTPUT"

      - name: Create GitHub release with generated changelog
        if: steps.previous.outputs.previous_tag != ''
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          gh release create "$TAG" \
            --title "$TAG" \
            --notes "${{ steps.changelog.outputs.changes }}"

      - name: Create GitHub release for first version
        if: steps.previous.outputs.previous_tag == ''
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
          NOTES: ${{ steps.fallback.outputs.notes }}
        run: |
          gh release create "$TAG" \
            --title "$TAG" \
            --notes "$NOTES"
